<!doctype html>
<html
  lang="ms"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"kind","type":"enum","label":"Jenis label","default":"note","options":[{"value":"chapter","label":"Tag segmen"},{"value":"note","label":"Nota"},{"value":"fix","label":"Pembetulan"}]},
    {"id":"align","type":"enum","label":"Kedudukan","default":"left","options":[{"value":"left","label":"Atas kiri"},{"value":"right","label":"Atas kanan"}]},
    {"id":"tag","type":"string","label":"Tag kecil","default":"SET INDUKSI"},
    {"id":"text","type":"string","label":"Teks","default":"Tayangan video Menara Berkembar PETRONAS"},
    {"id":"wrong","type":"string","label":"Salah","default":"seekor kerusi"},
    {"id":"right","type":"string","label":"Betul","default":"sebuah kerusi"},
    {"id":"accent","type":"color","label":"Warna aksen","default":"#7cc4ff"},
    {"id":"dur","type":"number","label":"Durasi (s)","default":5}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: DocDisplay; src: url("assets/fonts/montserrat-latin-800-normal.woff2"); font-weight: 800; }
      @font-face { font-family: DocBody; src: url("assets/fonts/inter-latin-400-normal.woff2"); font-weight: 400; }
      @font-face { font-family: DocBody; src: url("assets/fonts/inter-latin-600-normal.woff2"); font-weight: 600; }
      @font-face { font-family: DocMono; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: DocBody, sans-serif; color: #fff; }
      #card { position: absolute; top: 24px; left: 56px; max-width: 980px; display: flex; overflow: hidden; border-radius: 16px;
        background: rgba(7, 18, 41, 0.84); box-shadow: 0 14px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(124,196,255,.35); }
      #card.right { left: auto; right: 56px; }
      #bar { width: 8px; flex: none; background: var(--accent, #7cc4ff); }
      #body { padding: 12px 24px 14px 20px; }
      #tag { font-family: DocMono, monospace; font-weight: 700; font-size: 17px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent, #7cc4ff); }
      #text { margin-top: 6px; font-weight: 600; font-size: 31px; line-height: 1.25; }
      #card.chapter #text { font-family: DocDisplay; font-weight: 800; font-size: 40px; letter-spacing: -.01em; }
      #fixrow { display: none; margin-top: 4px; align-items: center; gap: 18px; font-family: DocDisplay; font-weight: 800; font-size: 36px; }
      #card.fix #fixrow { display: flex; }
      #card.fix #text { font-size: 24px; font-weight: 400; color: #cfe0f7; }
      #wrong { position: relative; color: #ff8a9c; }
      #wrong i { position: absolute; left: -4px; right: -4px; top: 54%; height: 4px; background: #ff4d6d; transform-origin: left; }
      #arrow { color: #f5c451; }
      #right { color: #6dffa8; }
      #tick { display: inline-flex; width: 38px; height: 38px; border-radius: 50%; background: #2ecc71; color: #062; align-items: center; justify-content: center; font-size: 26px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="6">
        <div id="bar"></div>
        <div id="body">
          <div id="tag" data-var-text="tag">SET INDUKSI</div>
          <div id="text" data-var-text="text">Tayangan video Menara Berkembar PETRONAS</div>
          <div id="fixrow"><span id="wrong"><span id="wtext" data-var-text="wrong">seekor kerusi</span><i></i></span><span id="arrow">→</span><span id="right" data-var-text="right">sebuah kerusi</span><span id="tick">✓</span></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const card = document.getElementById("card");
        const kind = v.kind || "note";
        card.classList.add(kind);
        if (v.align === "right") card.classList.add("right");
        if (v.accent) document.getElementById("root").style.setProperty("--accent", v.accent);
        if (v.tag != null) document.getElementById("tag").textContent = v.tag;
        if (v.text != null) document.getElementById("text").textContent = v.text;
        if (v.wrong != null) document.getElementById("wtext").textContent = v.wrong;
        if (v.right != null) document.getElementById("right").textContent = v.right;
        if (kind === "fix") document.getElementById("text").style.display = "none";
        const D = Math.min(6, Math.max(3, Number(v.dur) || 5));
        const fromRight = v.align === "right";
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#card", { x: fromRight ? 60 : -60, opacity: 0, clipPath: fromRight ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)" },
          { x: 0, opacity: 1, clipPath: "inset(0 0% 0 0%)", duration: 0.55, ease: "power3.out" }, 0.05);
        tl.fromTo("#tag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.35);
        tl.fromTo("#text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.45);
        if (kind === "fix") {
          tl.fromTo("#wrong", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.55);
          tl.fromTo("#wrong i", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.0);
          tl.fromTo("#arrow", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3 }, 1.3);
          tl.fromTo("#right", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.5);
          tl.fromTo("#tick", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, 1.8);
        }
        tl.to("#card", { opacity: 0, x: fromRight ? 40 : -40, duration: 0.4, ease: "power2.in" }, D - 0.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
